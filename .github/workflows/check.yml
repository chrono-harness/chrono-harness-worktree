name: check
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78
        with:
          version: 2026.11.12
          cache: false
          install_args: http:verus
      - run: VERUS="$(mise which verus)" ./check.sh
