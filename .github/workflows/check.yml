name: check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 验证工具来源并运行检查
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o verus.zip https://github.com/verus-lang/verus/releases/download/release/0.2026.04.24.f8e1704/verus-0.2026.04.24.f8e1704-arm64-macos.zip
          echo '023e0a6e67bb9927f43a8757ebdec318b50cbfe1fec4a1c320c53d5fd71008e7  verus.zip' | shasum -a 256 -c -
          tar -xf verus.zip
          cd "$GITHUB_WORKSPACE"
          VERUS="$RUNNER_TEMP/verus-arm64-macos/verus" ./check.sh
