name: Release chrono-worktree
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  source:
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release branch
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          directory=$(mktemp -d "$RUNNER_TEMP/tag-check.XXXXXXXX")
          trap 'rm -rf -- "$directory"' EXIT
          curl --fail --silent --show-error --location \
            'https://github.com/chrono-harness/chrono-harness-host-release/releases/download/v0.1.3/chrono-host-release-linux-x86_64' \
            --output "$directory/chrono-host-release"
          (cd "$directory" && echo '96dd49fd2c6ad7bac8938ac351459e9b8751f7c917a7239e15994b26771a9a4e  chrono-host-release' | sha256sum --check --status)
          chmod 700 "$directory/chrono-host-release"
          prerelease=$("$directory/chrono-host-release" check-pushed-tag "$GITHUB_REF_NAME" --prerelease)
          printf 'prerelease=%s\n' "$prerelease" >> "$GITHUB_OUTPUT"
  build:
    needs: source
    strategy:
      matrix:
        include:
          - runner: macos-15
            platform: macos-aarch64
          - runner: ubuntu-24.04
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build and exercise the release binary
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/target
        run: |
          set -euo pipefail
          cargo build --release --locked --manifest-path crates/worktree/Cargo.toml
          binary="$CARGO_TARGET_DIR/release/chrono-worktree"
          version=${GITHUB_REF_NAME#v}
          test "$("$binary" --version)" = "chrono-worktree ${version%%-*}"
          "$binary" --help | grep -F 'chrono-worktree start'
          mkdir "$RUNNER_TEMP/dist"
          cp "$CARGO_TARGET_DIR/release/chrono-worktree" "$RUNNER_TEMP/dist/chrono-worktree-$PLATFORM"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.platform }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: [source, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093b
        with:
          path: ${{ runner.temp }}/dist
          merge-multiple: true
      - name: Publish binaries and their checksums
        working-directory: ${{ runner.temp }}/dist
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.source.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum chrono-worktree-macos-aarch64 chrono-worktree-linux-x86_64 > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes --prerelease="$PRERELEASE" \
            chrono-worktree-macos-aarch64 chrono-worktree-linux-x86_64 SHA256SUMS
