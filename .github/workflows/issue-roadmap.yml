name: Issue roadmap
on:
  issues:
    types: [opened, reopened, closed, milestoned, demilestoned, deleted, transferred]
  release:
    types: [published]
  workflow_run:
    workflows: ["Release chrono-worktree"]
    types: [completed]
  push:
    branches: ["dev"]
    paths: [.chrono-harness/release.json, .github/roadmap.cjs, .github/workflows/issue-roadmap.yml]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  release-issue:
    if: github.event_name == 'workflow_run'
    permissions:
      contents: read
      issues: write
      actions: read
    concurrency:
      group: release-issue-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install the release verifier
        shell: bash
        run: |
          set -euo pipefail
          directory=$(mktemp -d "$RUNNER_TEMP/release-tool.XXXXXXXX")
          curl --fail --silent --show-error --location "https://github.com/chrono-harness/chrono-harness-host-release/releases/download/v0.1.1/chrono-host-release-linux-x86_64" -o "$directory/chrono-host-release"
          (cd "$directory" && echo "8fd9f01086ad928167f2a6a0db1f6277ffc9c60cbfaf5b1994de946044040058  chrono-host-release" | sha256sum --check --status)
          chmod 755 "$directory/chrono-host-release"
          echo "$directory" >> "$GITHUB_PATH"

      - uses: actions/github-script@v8.0.0
        with:
          script: await require('./.github/roadmap.cjs').releaseIssue(github, context)
  reconcile:
    needs: release-issue
    if: always() && (needs.release-issue.result == 'success' || needs.release-issue.result == 'skipped')
    concurrency:
      group: issue-roadmap
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Install the release verifier
        shell: bash
        run: |
          set -euo pipefail
          directory=$(mktemp -d "$RUNNER_TEMP/release-tool.XXXXXXXX")
          curl --fail --silent --show-error --location "https://github.com/chrono-harness/chrono-harness-host-release/releases/download/v0.1.1/chrono-host-release-linux-x86_64" -o "$directory/chrono-host-release"
          (cd "$directory" && echo "8fd9f01086ad928167f2a6a0db1f6277ffc9c60cbfaf5b1994de946044040058  chrono-host-release" | sha256sum --check --status)
          chmod 755 "$directory/chrono-host-release"
          echo "$directory" >> "$GITHUB_PATH"

      - uses: actions/github-script@v8.0.0
        with:
          script: |
            const fs = require('node:fs')
            const file = '.chrono-harness/release.json'
            const plan = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : null
            await require('./.github/roadmap.cjs')(github, context, plan)
