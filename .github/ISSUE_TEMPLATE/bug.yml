name: 报告缺陷
description: 现有行为与预期不符。
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: 实际发生了什么？
      description: 给出版本、可重复的步骤和实际结果。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
      description: 说明同一输入应得到的结果。
    validations:
      required: true
