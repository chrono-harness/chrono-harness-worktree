name: 改进文档
description: 修正或补充指南、示例和参考资料。
labels: [documentation]
body:
  - type: textarea
    id: location
    attributes:
      label: 哪份文档需要改进？
      description: 给出页面、文件或命令的名称或链接。
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 读者需要什么信息？
      description: 说明有疑问的内容、缺少的步骤或应修正的说法。
    validations:
      required: true
