[package]
name = "chrono-worktree-tests"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[dependencies]
hex = "0.4"
sha2 = "0.11"
rustix = { version = "1", features = ["net"] }
tempfile = "3"
vstd = "=0.0.0-2026-04-20-1748"
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "=0.10.0" }
chrono-worktree = { path = "../worktree", features = ["remote-observation-test", "producer-birth-test"] }

[[test]]
name = "verified_attention"
path = "tests/verified_attention.rs"

[[test]]
name = "verified_owner_publication"
path = "tests/verified_owner_publication.rs"

[[test]]
name = "check_inputs"
path = "tests/proof_support/worktree/check_inputs.rs"

[[test]]
name = "observation_age"
path = "tests/observation_age.rs"

[[test]]
name = "adopted_owner"
path = "tests/adopted_owner.rs"

[[test]]
name = "log_retention"
path = "tests/log_retention.rs"

[[test]]
name = "git_checkout"
path = "tests/git_checkout.rs"

[[bin]]
name = "mock-worktree-child"
path = "tests/fixtures/process.rs"
test = false
bench = false

[[test]]
name = "process"
path = "tests/process.rs"
