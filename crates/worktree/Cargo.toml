[package]
name = "chrono-worktree"
version = "0.1.16"
edition = "2024"
publish = false
description = "Explicit host worktree lifecycle operations"

[lib]
test = false
doctest = false

[features]
# Deterministic scheduling seam used only by the dedicated receipt behavior tests.
producer-birth-test = []
# Expose the injected Git observation boundary to the dedicated test package.
remote-observation-test = []

[[bin]]
name = "chrono-worktree"
path = "src/main.rs"
test = false
bench = false

[dependencies]
hex = "0.4"
serde_yaml_ng = "=0.10.0"
litrs = "=1.0.1"
rustix = { version = "1", features = ["fs", "net"] }
sha2 = "0.11"
sha1 = "0.11"
miniz_oxide = "0.9"
serde_jcs = "=0.4.0"
vstd = "=0.0.0-2026-04-20-1748"
tracing-tunnel = { version = "=0.1.0", default-features = false, features = ["sender"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["raw_value"] }
tempfile = "3"
libc = "0.2"
time = { version = "0.3", features = ["formatting"] }

[profile.dev.package.sha2]
opt-level = 3

[profile.dev]
opt-level = 1
